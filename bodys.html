<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympo Shop - Bodys</title>
    <style>
        :root {
            --bg-color: #f9f8f6;
            --header-bg: #f9f8f6;
            --text-color: #2c2c2c;
            --accent-color: #d4af37;
            --card-bg: #ffffff;
            --border-color: #e5e0d8;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); }
        
        /* Header y Logo */
        header { background-color: var(--header-bg); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .social-top { display: flex; gap: 8px; }
        .social-top a { text-decoration: none; font-size: 12px; font-weight: 600; color: #fff; padding: 6px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
        .btn-wsp { background-color: #25d366; }
        .btn-ig { background-color: #e1306c; }
        .logo-container { text-align: center; flex-grow: 1; order: -1; width: 100%; }
        @media (min-width: 768px) {
            .logo-container { order: 0; width: auto; }
            header { padding: 20px 40px; }
        }
        .logo-link { text-decoration: none; color: #222; display: inline-block; }
        h1 { margin: 0; font-size: 22px; letter-spacing: 3px; font-weight: 400; color: #222; }
        @media (min-width: 768px) { h1 { font-size: 26px; letter-spacing: 4px; } }
        
        /* Barra de Navegación */
        nav { background-color: #ffffff; border-bottom: 1px solid var(--border-color); width: 100%; position: sticky; top: 0; z-index: 1000; }
        .nav-menu { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; flex-wrap: wrap; }
        
        .nav-item { position: relative; }
        
        /* Enlaces principales */
        .nav-item > a { display: block; padding: 12px 16px; text-decoration: none; color: var(--text-color); font-size: 13px; font-weight: 500; letter-spacing: 0.5px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        @media (min-width: 768px) {
            .nav-item > a { padding: 15px 20px; font-size: 14px; letter-spacing: 1px; }
        }
        .nav-item > a:hover { background-color: #f1ede6; color: #000; }
        
        /* Estilo de la flechita (triángulo) */
        .arrow { font-size: 10px; margin-left: 5px; vertical-align: middle; transition: transform 0.3s ease; display: inline-block; }
        
        /* Menú desplegable (Dropdown) */
        .dropdown { display: none; position: absolute; top: 100%; left: 0; background-color: #ffffff; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); list-style: none; min-width: 200px; z-index: 1000; border: 1px solid var(--border-color); margin: 0; padding: 0; }
        
        /* Clase que activa el menú desplegable en celular y compu */
        .nav-item.show .dropdown { display: block; }
        .nav-item.show .arrow { transform: rotate(180deg); }
        
        /* Estilo de los enlaces dentro del dropdown */
        .dropdown li a { display: block; padding: 12px 20px; text-decoration: none; color: var(--text-color); font-size: 13px; border-bottom: 1px solid #f4f4f4; white-space: nowrap; transition: all 0.2s; }
        .dropdown li a:hover { background-color: #f9f8f6; color: var(--accent-color); }

        /* Comportamiento en computadora (Hover) - Se activa solo si el ancho es mayor a 768px */
        @media (min-width: 768px) {
            .nav-item:hover .dropdown { display: block; }
            .nav-item:hover .arrow { transform: rotate(180deg); }
        }

        /* Barra de Volver */
        .nav-volver { padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--border-color); }
        @media (min-width: 768px) { .nav-volver { padding: 12px 40px; } }
        .nav-volver a { text-decoration: none; color: var(--accent-color); font-weight: 600; font-size: 13px; }

        /* Título de la Sección */
        .section-title { max-width: 1200px; margin: 25px auto 10px auto; padding: 0 15px; font-size: 18px; font-weight: 600; color: #333; border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; }
        @media (min-width: 768px) { .section-title { padding: 0 20px; font-size: 22px; margin: 30px auto 10px auto; } }

        /* Catálogo de Productos */
        .catalog-container { max-width: 1200px; margin: 20px auto; padding: 0 15px 40px 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .catalog-container { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 0 20px 50px 20px; } }

        /* Tarjeta de Producto */
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow 0.3s; }
        .card:hover { box-shadow: 0 6px 15px rgba(0,0,0,0.07); }
        .card img { width: 100%; height: 180px; object-fit: cover; background-color: #eee; cursor: pointer; transition: opacity 0.2s; }
        @media (min-width: 768px) { .card img { height: 260px; } }
        .card img:hover { opacity: 0.9; }
        .card-body { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
        @media (min-width: 768px) { .card-body { padding: 15px; } }
        .card-title { font-size: 12px; font-weight: 600; margin: 0 0 4px 0; color: #444; }
        @media (min-width: 768px) { .card-title { font-size: 13px; margin: 0 0 5px 0; } }
        .card-brand { font-size: 10px; font-weight: 700; color: var(--accent-color); margin-bottom: 4px; text-transform: uppercase; }
        @media (min-width: 768px) { .card-brand { font-size: 11px; margin-bottom: 5px; } }
        .card-desc { font-size: 10px; color: #777; margin: 0 0 10px 0; flex-grow: 1; }
        @media (min-width: 768px) { .card-desc { font-size: 11px; margin: 0 0 15px 0; } }
        .btn-consultar { background-color: #25d366; color: white; text-align: center; padding: 8px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: 600; margin-top: auto; transition: background-color 0.2s; }
        @media (min-width: 768px) { .btn-consultar { padding: 10px; font-size: 12px; } }
        .btn-consultar:hover { background-color: #1ebe57; }

        /* Modal (Popup) */
        #modal-producto { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; opacity: 0; transition: opacity 0.3s; }
        #modal-producto.modal-show { display: flex; opacity: 1; }
        .modal-contenido { background-color: #fff; border-radius: 10px; max-width: 420px; width: 100%; overflow: hidden; box-shadow: 0px 8px 25px rgba(0,0,0,0.25); position: relative; display: flex; flex-direction: column; transform: scale(0.95); transition: transform 0.3s; }
        #modal-producto.modal-show .modal-contenido { transform: scale(1); }
        .modal-cerrar { position: absolute; top: 10px; right: 15px; font-size: 26px; font-weight: bold; color: #333; cursor: pointer; z-index: 10; background: rgba(255,255,255,0.8); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .modal-cerrar:hover { color: var(--accent-color); }
        .modal-img-container { width: 100%; height: 280px; background-color: #f4f4f4; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        @media (min-width: 768px) { .modal-img-container { height: 350px; } }
        .modal-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        @media (min-width: 768px) { .modal-body { padding: 20px; gap: 8px; } }
        .modal-brand { font-size: 11px; font-weight: 700; color: var(--accent-color); text-transform: uppercase; }
        .modal-title { font-size: 15px; font-weight: 600; color: #222; margin: 0; }
        .modal-desc { font-size: 12px; color: #666; margin-bottom: 8px; }
        .modal-btn-wsp { background-color: #25d366; color: white; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; display: block; transition: background-color 0.2s; }
        .modal-btn-wsp:hover { background-color: #1ebe57; }

        /* Botón Volver Arriba */
        #btn-volver-arriba { position: fixed; bottom: 20px; right: 20px; background-color: var(--accent-color); color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; font-weight: bold; box-shadow: 0px 4px 10px rgba(0,0,0,0.15); z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s; }
        #btn-volver-arriba.show { opacity: 1; visibility: visible; }
        @media (min-width: 768px) { #btn-volver-arriba { bottom: 25px; right: 25px; width: 42px; height: 42px; font-size: 20px; } }
    </style>
</head>
