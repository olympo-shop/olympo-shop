    <style>
        :root {
            --bg-color: #faf9f6;
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #777777;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e5e0d8;
            padding-bottom: 20px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 36px;
            color: #1a1a1a;
            margin: 0 0 5px 0;
        }
        .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .instagram-link {
            display: inline-block;
            font-size: 12px;
            color: #e1306c;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid #e1306c;
            padding: 5px 12px;
            border-radius: 15px;
            transition: all 0.2s ease;
        }
        .instagram-link:hover {
            background-color: #e1306c;
            color: #fff;
        }
        
        /* BOTONES DE SECCIONES (INTERACTIVO) */
        .nav-categories {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background-color: #f0ece1;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cat-btn:hover, .cat-btn.active {
            background-color: #2c2c2c;
            color: #ffffff;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f0eee9;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }
        .product-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #f4f2ee;
        }
        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .product-brand {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .product-name {
            font-size: 13px;
            font-weight: 500;
            color: #2c2c2c;
            margin-bottom: 3px;
        }
        .product-color {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .product-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid #f7f5f0;
            padding-top: 10px;
        }
        .tag {
            font-size: 10px;
            background-color: #25d366;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* MODAL / VENTANA DETALLE */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-image {
            width: 50%;
            height: 380px;
            object-fit: cover;
            background-color: #f4f2ee;
        }
        .modal-details {
            width: 50%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #333;
            background: none;
            border: none;
        }
        .modal-brand {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 10px;
        }
        .modal-color, .modal-talle {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .buy-whatsapp {
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-top: 20px;
        }
        .buy-whatsapp:hover {
            background-color: #20ba5a;
        }

        @media (max-width: 600px) {
            .modal-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .modal-image, .modal-details { width: 100%; }
            .modal-image { height: 250px; }
        }
    </style>
</head>

        const container = document.getElementById('catalog');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');
        
        const modalImg = document.getElementById('modalImg');
        const modalBrand = document.getElementById('modalBrand');
        const modalName = document.getElementById('modalName');
        const modalColor = document.getElementById('modalColor');
        const modalTalle = document.getElementById('modalTalle');
        const modalWa = document.getElementById('modalWa');

        function mostrarProductos(categoria) {
            container.innerHTML = '';
            const filtrados = categoria === 'todos' ? productos : productos.filter(p => p.cat === categoria);
            
            filtrados.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.foto}" alt="${p.nombre}" class="product-image" loading="lazy">
                    <div class="product-info">
                        <div>
                            <div class="product-brand">${p.marca}</div>
                            <div class="product-name">${p.nombre}</div>
                            <div class="product-color">Color: ${p.color}</div>
                        </div>
                        <div class="product-footer">
                            <span class="tag">Consultar</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    modalImg.src = p.foto;
                    modalBrand.textContent = p.marca;
                    modalName.textContent = p.nombre;
                    modalColor.textContent = "Color: " + p.color;
                    modalTalle.textContent = "Talle: " + p.talle;
                    
                    const mensaje = `Hola! Me interesa saber el precio de este producto: *${p.nombre}* (${p.marca}) - Talle: ${p.talle} - Color: ${p.color}`;
                    modalWa.href = `https://wa.me/5491168327127?text=${encodeURIComponent(mensaje)}`;

                    modalOverlay.style.display = 'flex';
                });

                container.appendChild(card);
            });
        }

        function filtrar(cat, boton) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            mostrarProductos(cat);
        }

        // Cargar todo al entrar por primera vez
        mostrarProductos('todos');

        closeModal.addEventListener('click', () => { modalOverlay.style.display = 'none'; });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.style.display = 'none';
        });
    </script>
